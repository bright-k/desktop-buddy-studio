[package]
name = "buddy-player"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
default = []
preview = []

[dependencies]
buddy-project = { path = "../../../crates/buddy-project" }
buddy-runtime = { path = "../../../crates/buddy-runtime" }
buddy-platform = { path = "../../../crates/buddy-platform" }
